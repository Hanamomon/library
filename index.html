<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link rel="stylesheet" href="styles.css">

</head>
<body>
    <table>
        <caption>Library</caption>
        <tr>
            <th scope="col">Title</th>
            <th scope="col">Author</th>
            <th scope="col">Pages</th>
            <th scope="col">Read Status</th>
            <th scope="col">Manage</th>
        </tr>
    </table>
    <button id="showDialog">New Book</button>
    <dialog>
        <form novalidate>
            <div id="title_field">
                <label for="title">Title:</label>
                <input type="text" id="title" name="book_title">
                <span class="error"></span>
            </div>
            <div id="author_field">
                <label for="author">Author:</label>
                <input type="text" id="author" name="book_author">
                <span class="error"></span>
            </div>
            <div id="pages_field">
                <label for="pages">Pages:</label>
                <input type="text" id="pages" name="book_pages">
                <span class="error"></span>
            </div>
            <div>
                <fieldset>
                    <legend>Read Status:</legend>
                    <input type="radio" id="unread" name="read-status" value="unread" checked>
                    <label for="unread">Unread</label>
                    <input type="radio" id="read" name="read-status" value="read">
                    <label for="read">Read</label>
                </fieldset>
            </div>
            <button value="cancel" formmethod="dialog">Cancel</button>
            <button id="confirmBtn" value="default">Confirm</button>
        </form>
    </dialog>
    <script src="script.js"></script>
</body>
</html>
