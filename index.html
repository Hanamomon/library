<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">

</head>
<body>
    <table>
        <tr>
            <th>Title</th>
            <th>Author</th>
            <th>Pages</th>
            <th>Read Status</th>
        </tr>
    </table>
    <button id="showDialog">New Book</button>
    <dialog>
        <form>
            <div>
                <label for="title">Title:</label>
                <input type="text" id="title" name="book_title">
            </div>
            <div>
                <label for="author">Author:</label>
                <input type="text" id="author" name="book_author">
            </div>
            <div>
                <label for="pages">Pages:</label>
                <input type="text" id="pages" name="book_pages">
            </div>
            <div>
                <label for="read-status">Read Status:</label>
                <input type="checkbox" id="read-status" name="read-status">
            </div>
            <button value="cancel" formmethod="dialog">Cancel</button>
            <button id="confirmBtn" value="default">Confirm</button>
        </form>
    </dialog>
    <script src="script.js"></script>
</body>
</html>
